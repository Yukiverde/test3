<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodging Game</title>

<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

#game{
    position:relative;
    width:500px;
    height:700px;
    background:#222;
    border:4px solid white;
    overflow:hidden;
}

#player{
    position:absolute;
    width:40px;
    height:40px;
    background:deepskyblue;
    border-radius:8px;
}

.enemy{
    position:absolute;
    width:40px;
    height:40px;
    background:red;
    border-radius:8px;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    z-index:100;
}

#gameOver{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,0.8);
    color:white;
    font-size:32px;
    z-index:200;
}

#gameOver p{
    font-size:20px;
}
</style>
</head>

<body>

<div id="game">

    <div id="score">Score: 0</div>

    <div id="player"></div>

    <div id="gameOver">
        <div>GAME OVER</div>
        <p>Press R to Restart</p>
    </div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreDisplay = document.getElementById("score");
const gameOverScreen = document.getElementById("gameOver");

const gameWidth = 500;
const gameHeight = 700;

let playerX = 230;
let playerY = 620;
let playerSpeed = 6;

let keys = {};
let enemies = [];

let score = 0;
let gameRunning = true;

player.style.left = playerX + "px";
player.style.top = playerY + "px";

document.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;

    if(!gameRunning && e.key.toLowerCase() === "r"){
        restartGame();
    }
});

document.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

function spawnEnemy(){
    const enemy = document.createElement("div");
    enemy.classList.add("enemy");

    const size = 30 + Math.random()*30;

    enemy.style.width = size + "px";
    enemy.style.height = size + "px";
    enemy.style.left = Math.random()*(gameWidth-size) + "px";
    enemy.style.top = "-50px";

    game.appendChild(enemy);

    enemies.push({
        el: enemy,
        x: parseFloat(enemy.style.left),
        y: -50,
        size: size,
        speed: 3 + Math.random()*4
    });
}

function updatePlayer(){

    if(keys["a"] || keys["arrowleft"])
        playerX -= playerSpeed;

    if(keys["d"] || keys["arrowright"])
        playerX += playerSpeed;

    if(keys["w"] || keys["arrowup"])
        playerY -= playerSpeed;

    if(keys["s"] || keys["arrowdown"])
        playerY += playerSpeed;

    playerX = Math.max(0, Math.min(gameWidth-40, playerX));
    playerY = Math.max(0, Math.min(gameHeight-40, playerY));

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";
}

function checkCollision(aX,aY,aW,aH,bX,bY,bW,bH){
    return (
        aX < bX + bW &&
        aX + aW > bX &&
        aY < bY + bH &&
        aY + aH > bY
    );
}

function updateEnemies(){

    for(let i=enemies.length-1;i>=0;i--){

        let e = enemies[i];

        e.y += e.speed;
        e.el.style.top = e.y + "px";

        if(checkCollision(
            playerX, playerY, 40, 40,
            e.x, e.y, e.size, e.size
        )){
            endGame();
        }

        if(e.y > gameHeight + 100){
            e.el.remove();
            enemies.splice(i,1);
        }
    }
}

function endGame(){
    gameRunning = false;
    gameOverScreen.style.display = "flex";
}

function restartGame(){

    enemies.forEach(e=>e.el.remove());
    enemies = [];

    playerX = 230;
    playerY = 620;

    score = 0;

    gameRunning = true;
    gameOverScreen.style.display = "none";
}

function gameLoop(){

    if(gameRunning){

        updatePlayer();
        updateEnemies();

        score += 1;
        scoreDisplay.textContent = "Score: " + score;
    }

    requestAnimationFrame(gameLoop);
}

setInterval(()=>{
    if(gameRunning){
        spawnEnemy();
    }
},500);

gameLoop();
</script>

</body>
</html>
